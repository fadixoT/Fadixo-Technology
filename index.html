<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  background: black;
  color: white;
  margin: 0;
  font-family: Arial, sans-serif;
}

/* SPLASH SCREEN */
#splash {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
#splash img {
  width: 180px;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

/* MAIN CONTENT - BIG BOLD CENTRALIZE */
#main {
  display: none;
  min-height: 100vh;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
#main img { width: 150px; margin-bottom: 20px; }
#main h1 {
  font-size: 32px;
  font-weight: 900;
  max-width: 90%;
  line-height: 1.3;
}
#main p { color: #aaa; margin-bottom: 25px; }
#main button {
  background: #00C2FF;
  color: black;
  border: none;
  padding: 14px 32px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>
<body>

<div id="splash">
  <img src="logo.png" alt="Fadixo">
</div>

<div id="main">
  <img src="logo.png" alt="FT Logo">
  <h1>Sign up to Fadixo Technology to get the best website for your company.</h1>
  <p>Professional, fast and affordable web solutions.</p>
  <button>Get Started</button>
</div>

<script>
  setTimeout(function(){
    document.getElementById('splash').style.display = 'none';
    document.getElementById('main').style.display = 'flex';
  }, 2500); // 2.5 seconds splash
</script>

</body>
</html>s
