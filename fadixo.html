<!DOCTYPE html>
<html>
<head>
<title>FADIXO TECHNOLOGY</title>
<style>
body {
  margin:0;
  background:black;
  font-family: Arial, sans-serif;
  overflow:hidden;
}

/* 1. SPLASH SCREEN - shows first */
#splash {
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100vh;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index: 1000;
  transition: opacity 0.8s ease;
}
#splash img {
  width: 220px;
  animation: popUp 1.2s ease;
}

@keyframes popUp {
  0% { transform: scale(0); opacity:0; }
  60% { transform: scale(1.15); opacity:1; }
  80% { transform: scale(0.95); }
  100% { transform: scale(1); }
}

/* 2. MAIN PAGE - hidden at first */
#main {
  display:none;
  min-height:100vh;
  background:black;
  color:white;
  text-align:center;
}
.header {
  padding:20px;
  display:flex;
  justify-content:space-between;
}
.btn {
  background:#00e5ff;
  color:black;
  padding:12px 28px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <img src="fadixo logo.png" alt="FADIXO">
</div>

<!-- MAIN PAGE -->
<div id="main">
  <div class="header">
    <div>FADIXO TECHNOLOGY</div>
    <div><a href="login.html" style="color:white; text-decoration:none; margin-right:15px;">Login</a> <a href="signup.html" class="btn">Sign Up</a></div>
  </div>

  <div style="margin-top:80px;">
    <img src="fadixo logo.png" style="width:180px;">
    <h1>Sign up to Fadixo Technology to get<br>the best website for your company.</h1>
    <p style="color:#aaa;">Professional, fast and affordable web solutions.</p>
    <br>
    <a href="signup.html" class="btn">Get Started</a>
  </div>
</div>

<script>
// After 2.5 seconds, hide splash and show main
setTimeout(function(){
  document.getElementById('splash').style.opacity = '0';
  setTimeout(function(){
    document.getElementById('splash').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    document.body.style.overflow = 'auto';
  }, 800);
}, 2500); // change 2500 to 4000 if you want longer like WhatsApp
</script>

</body>
</html>
